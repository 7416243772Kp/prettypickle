<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pretty Pickles — Authentic homemade pickles, snacks & more delivered to your doorstep">
    <title>Pretty Pickles — Authentic Homemade Pickles</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
</head>
<body>

    <div id="header-container"></div>

    <main>
        <!-- Scrolling Banner -->
        <div id="scrollingBannerContainer"></div>

        <!-- Top Banner Carousel -->
        <div id="topBannerContainer"></div>

        <div class="container">
            <!-- Category Bar -->
            <div class="category-bar" id="categoryBar">
                <a href="/categories" class="category-chip active">All</a>
            </div>

            <!-- Best Sellers by Category -->
            <div id="bestSellersContainer"></div>

            <!-- All Products Menu -->
            <div id="menuContainer"></div>

            <!-- Recently Viewed -->
            <div class="recently-viewed" id="recentlyViewed" style="display:none;">
                <h2>Recently Viewed</h2>
                <div class="recently-viewed-scroll" id="recentlyViewedItems"></div>
            </div>
        </div>

        <!-- Bottom Banners -->
        <div id="bottomBannerContainer" style="margin-top:30px;"></div>
    </main>

    <div id="footer-container"></div>

    <script src="/js/components.js"></script>
    <script src="/js/index.js"></script>
</body>
</html>
