<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Coupon Form | Admin — Pretty Pickles</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="admin-layout">
        <div id="admin-sidebar-container"></div>

        <div class="admin-content">
            <div class="admin-page">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                    <h1 id="pageTitle">Create Coupon</h1>
                    <a href="/admin/coupons" class="btn btn-small" style="background:#f5f5f5;color:#000;">← Back</a>
                </div>

                <div id="loadingIndicator" style="text-align:center;padding:40px;">
                    Loading...
                </div>

                <form id="couponForm" style="display:none;max-width:800px;background:#fff;padding:24px;border-radius:8px;border:1px solid var(--border-light);">
                    <input type="hidden" id="couponId" name="id">

                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
                        <div class="form-group">
                            <label>Coupon Code *</label>
                            <input type="text" name="code" id="code" required style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:4px;text-transform:uppercase;">
                        </div>
                        <div class="form-group">
                            <label>Usage Type *</label>
                            <select name="usageType" id="usageType" required style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:4px;">
                                <option value="public_unlimited">Public & Unlimited Uses</option>
                                <option value="public_limited_per_user">Public & Limited per User</option>
                                <option value="single_use_global">Global Single-Use (Burn after use)</option>
                                <option value="promoter">Promoter Link (Auto-applied)</option>
                            </select>
                        </div>
                    </div>

                    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;">
                        <div class="form-group">
                            <label>Discount Type *</label>
                            <select name="discountType" id="discountType" required style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:4px;">
                                <option value="percentage">Percentage (%)</option>
                                <option value="fixed">Fixed Amount (₹)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Discount Value *</label>
                            <input type="number" name="discountValue" id="discountValue" required min="0" step="0.01" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:4px;">
                        </div>
                        <div class="form-group">
                            <label>Max Discount (₹)</label>
                            <input type="number" name="maxDiscountAmount" id="maxDiscountAmount" min="0" step="0.01" placeholder="0 = No limit" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:4px;">
                        </div>
                    </div>

                    <hr style="margin:20px 0;border-top:1px solid #eee;">
                    
                    <h3>Scope</h3>
                    <div class="form-group" style="margin-top:12px;">
                        <label>Applies To *</label>
                        <select name="scope" id="scope" required style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:4px;">
                            <option value="all">All Products</option>
                            <option value="specific_products">Specific Products</option>
                            <option value="specific_categories">Specific Categories</option>
                        </select>
                    </div>

                    <div id="specificProductsContainer" class="form-group" style="display:none;background:#f9f9f9;padding:16px;border-radius:4px;">
                        <label>Select Products (Multi-select: hold Ctrl/Cmd)</label>
                        <select name="applicableProducts" id="applicableProducts" multiple style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:4px;height:150px;"></select>
                    </div>

                    <div id="specificCategoriesContainer" class="form-group" style="display:none;background:#f9f9f9;padding:16px;border-radius:4px;">
                        <label>Select Categories (Multi-select: hold Ctrl/Cmd)</label>
                        <select name="applicableCategories" id="applicableCategories" multiple style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:4px;height:150px;"></select>
                    </div>

                    <hr style="margin:20px 0;border-top:1px solid #eee;">

                    <h3>Advanced Settings</h3>
                    
                    <div class="form-group" style="margin-top:12px;">
                        <label>Max Uses Per User (for 'limited_per_user' type)</label>
                        <input type="number" name="maxUsesPerUser" id="maxUsesPerUser" value="1" min="1" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:4px;">
                    </div>

                    <div class="form-group">
                        <label>Expiry Date & Time (Optional)</label>
                        <input type="datetime-local" name="expiresAt" id="expiresAt" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:4px;">
                    </div>

                    <div id="promoterFields" style="display:none;background:#f0f8ff;padding:16px;border-radius:8px;border:1px solid #bce8f1;margin-bottom:20px;">
                        <h4 style="margin-bottom:12px;">Promoter Commissions</h4>
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
                            <div>
                                <label style="font-size:0.85rem;">Promoter UPI ID</label>
                                <input type="text" name="promoterUPI" id="promoterUPI" placeholder="e.g. john@ybl" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:4px;margin-bottom:8px;">
                                <label style="font-size:0.85rem;">Promoter % Commission</label>
                                <input type="number" name="promoterCommission" id="promoterCommission" value="0" min="0" max="100" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:4px;">
                            </div>
                            <div>
                                <label style="font-size:0.85rem;">Pickle Maker UPI ID</label>
                                <input type="text" name="makerUPI" id="makerUPI" placeholder="e.g. maker@ybl" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:4px;margin-bottom:8px;">
                                <label style="font-size:0.85rem;">Maker % Commission</label>
                                <input type="number" name="makerCommission" id="makerCommission" value="0" min="0" max="100" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:4px;">
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-full" id="submitBtn">Save Coupon</button>
                </form>

            </div>
        </div>
    </div>

    <script src="/js/admin/components.js"></script>
    <script src="/js/admin/coupon-form.js"></script>
</body>
</html>
