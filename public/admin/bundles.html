<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Bundles | Admin — Pretty Pickles</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="admin-layout">
        <div id="admin-sidebar-container"></div>

        <div class="admin-content">
            <div class="admin-page">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                    <h1>Combo Bundles</h1>
                    <button class="btn btn-primary" onclick="openBundleModal()">+ Create Bundle</button>
                </div>
                
                <div id="loadingIndicator" style="text-align:center;padding:40px;">
                    Loading bundles...
                </div>

                <div id="bundlesContainer" style="display:none;"></div>
            </div>
        </div>
    </div>

    <!-- Bundle Modal -->
    <div id="bundleModal" class="modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center;">
        <div class="modal-content" style="background:#fff;padding:24px;border-radius:8px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                <h2 id="modalTitle">Create Bundle</h2>
                <button class="btn btn-small" onclick="closeBundleModal()" style="background:transparent;color:#000;font-size:1.5rem;border:none;">&times;</button>
            </div>
            
            <form id="bundleForm">
                <input type="hidden" id="bundleId" name="id">
                
                <div class="form-group">
                    <label>Bundle Name *</label>
                    <input type="text" name="name" id="bName" required style="width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;">
                </div>
                
                <div class="form-group">
                    <label>Description</label>
                    <textarea name="description" id="bDesc" rows="3" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;"></textarea>
                </div>

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
                    <div class="form-group">
                        <label>Original Price (₹)</label>
                        <input type="number" name="originalPrice" id="bOriginal" min="0" step="0.01" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;">
                    </div>
                    <div class="form-group">
                        <label>Combo Offer Price (₹) *</label>
                        <input type="number" name="bundlePrice" id="bPrice" required min="0" step="0.01" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;">
                    </div>
                </div>

                <div class="form-group" style="background:#f9f9f9;padding:16px;border-radius:4px;">
                    <label>Select Products (Multi-select: hold Ctrl/Cmd)</label>
                    <p style="font-size:0.8rem;color:var(--gray-mid);margin-bottom:8px;">Only base products are selected here (it assumes 1qty of base variant). Custom quantities/variants UI requires advanced setup.</p>
                    <select id="bProducts" multiple required style="width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;height:200px;"></select>
                </div>

                <button type="submit" class="btn btn-primary btn-full" id="submitBtn">Save Bundle</button>
            </form>
        </div>
    </div>

    <script src="/js/admin/components.js"></script>
    <script src="/js/admin/bundles.js"></script>
</body>
</html>
