<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Dashboard | Admin — Pretty Pickles</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="admin-layout">
        
        <div id="admin-sidebar-container"></div>

        <div class="admin-content">
            <div class="admin-page">
                <h1>Dashboard</h1>

                <div id="dashboardStats" style="display:none;">
                    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:30px;">
                        <div class="stat-card"><div class="stat-card-label">Today</div><div class="stat-card-value" id="statToday">₹0</div></div>
                        <div class="stat-card"><div class="stat-card-label">Yesterday</div><div class="stat-card-value" id="statYesterday">₹0</div></div>
                        <div class="stat-card"><div class="stat-card-label">This Week</div><div class="stat-card-value" id="statWeek">₹0</div></div>
                        <div class="stat-card"><div class="stat-card-label">This Month</div><div class="stat-card-value" id="statMonth">₹0</div></div>
                    </div>

                    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:30px;">
                        <div class="stat-card"><div class="stat-card-label">Last Month</div><div class="stat-card-value" id="statLastMonth">₹0</div></div>
                        <div class="stat-card"><div class="stat-card-label">Total Sales</div><div class="stat-card-value" id="statTotalSales">₹0</div></div>
                        <div class="stat-card"><div class="stat-card-label">Total Orders</div><div class="stat-card-value" id="statTotalOrders">0</div></div>
                    </div>
                </div>

                <div id="loadingIndicator" style="text-align:center;padding:40px;">
                    Loading dashboard...
                </div>

                <div style="margin-bottom:30px; display:none;" id="chartContainer">
                    <h3 style="margin-bottom:16px;">Sales Trend</h3>
                    <canvas id="salesChart" height="80"></canvas>
                </div>

                <h3 style="margin-bottom:12px;">Recent Orders</h3>
                <table class="admin-table">
                    <thead><tr><th>Order ID</th><th>Customer</th><th>Amount</th><th>Payment</th><th>Status</th><th>Date</th></tr></thead>
                    <tbody id="recentOrdersTable">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Global Admin JS -->
    <script src="/js/admin/components.js"></script>
    <script src="/js/admin/dashboard.js"></script>
</body>
</html>
