<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Delivery System | Admin — Pretty Pickles</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="admin-layout">
        <div id="admin-sidebar-container"></div>

        <div class="admin-content">
            <div class="admin-page">
                <div style="margin-bottom:20px;">
                    <h1>Delivery Management</h1>
                </div>
                
                <div id="loadingIndicator" style="text-align:center;padding:40px;">
                    Loading delivery data...
                </div>

                <div id="deliveryContainer" style="display:none;grid-template-columns:1fr 1fr;gap:24px;">
                    
                    <!-- Settings Form -->
                    <div style="background:#fff;padding:24px;border-radius:8px;border:1px solid #eee;">
                        <h2 style="margin-bottom:16px;font-size:1.2rem;border-bottom:1px solid #eee;padding-bottom:12px;">Global Delivery Settings</h2>
                        <form id="deliverySettingsForm">
                            <div class="form-group">
                                <label>Base Delivery Charge (₹)</label>
                                <input type="number" name="deliveryCharge" id="deliveryCharge" required min="0" step="1" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;">
                            </div>
                            <div class="form-group">
                                <label>Free Delivery Above Order Amount (₹)</label>
                                <input type="number" name="freeDeliveryAbove" id="freeDeliveryAbove" required min="0" step="1" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;">
                            </div>
                            <div class="form-group">
                                <label>Expected Delivery Time Text</label>
                                <input type="text" name="expectedDeliveryText" id="expectedDeliveryText" required placeholder="e.g. 5-7 business days" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;">
                            </div>
                            <button type="submit" class="btn btn-primary" id="saveSettingsBtn">Save Settings</button>
                        </form>
                    </div>

                    <!-- Add Agent Form -->
                    <div style="background:#fff;padding:24px;border-radius:8px;border:1px solid #eee;">
                        <h2 style="margin-bottom:16px;font-size:1.2rem;border-bottom:1px solid #eee;padding-bottom:12px;">Add Delivery Agent</h2>
                        <form id="addPersonForm">
                            <div class="form-group">
                                <label>Full Name</label>
                                <input type="text" name="name" required style="width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;">
                            </div>
                            <div class="form-group">
                                <label>Login Email</label>
                                <input type="email" name="email" required style="width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;">
                            </div>
                            <div class="form-group">
                                <label>Temporary Password</label>
                                <input type="text" name="password" required style="width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;">
                            </div>
                            <div class="form-group">
                                <label>Phone Number (Optional)</label>
                                <input type="text" name="phone" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;">
                            </div>
                            <button type="submit" class="btn btn-primary" id="addAgentBtn">Add Agent</button>
                        </form>
                    </div>

                    <!-- Agents List -->
                    <div style="grid-column:1/-1;">
                        <h2 style="margin:24px 0 16px;font-size:1.2rem;border-bottom:1px solid #eee;padding-bottom:12px;">Delivery Agents</h2>
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                    <th>Active Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="agentsTableBody">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/admin/components.js"></script>
    <script src="/js/admin/delivery.js"></script>
</body>
</html>
