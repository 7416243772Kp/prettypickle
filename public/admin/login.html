<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Login — Pretty Pickles</title>
    <link rel="stylesheet" href="/css/theme.css">
    <style>
        .admin-login-page {
            display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f5f5f5;
        }
        .admin-login-box {
            background: #fff; padding: 40px; border-radius: 8px; width: 100%; max-width: 400px; box-shadow: 0 2px 20px rgba(0,0,0,0.08);
        }
        .error-message {
            display: none; background: #fff0f0; color: #d32f2f; padding: 10px; border-radius: 4px; margin-bottom: 16px; font-size: 0.85rem; text-align: center;
        }
        .step-container { display: none; }
        .step-container.active { display: block; }
    </style>
</head>
<body>
    <div class="admin-login-page">
        <div class="admin-login-box">
            <h1 style="text-align:center;font-size:1.5rem;margin-bottom:8px;">Pretty Pickles</h1>
            <p style="text-align:center;color:var(--gray-mid);margin-bottom:30px;">Admin Panel</p>

            <div id="errorMessage" class="error-message"></div>

            <!-- Step 1: Login -->
            <div id="step-login" class="step-container active">
                <form id="loginForm">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" required autofocus style="width:100%;padding:10px;border:2px solid var(--border-light);border-radius:4px;">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="password" required style="width:100%;padding:10px;border:2px solid var(--border-light);border-radius:4px;">
                    </div>
                    <button type="submit" class="btn btn-primary btn-full mt-20" style="background:#000;border-color:#000;">Login</button>
                </form>
            </div>

            <!-- Step 2: Setup TOTP -->
            <div id="step-setup-totp" class="step-container">
                <div style="text-align:center;">
                    <p style="margin-bottom:16px;font-weight:600;">Setup Two-Factor Authentication</p>
                    <p style="font-size:0.85rem;color:var(--gray-mid);margin-bottom:16px;">Scan this QR code with your authenticator app</p>
                    <img id="totpQrCode" src="" alt="TOTP QR Code" style="width:200px;height:200px;margin-bottom:16px;display:inline-block;">
                    <p style="font-size:0.75rem;color:var(--gray-mid);margin-bottom:20px;">Manual key: <code id="totpSecretText" style="background:#f5f5f5;padding:2px 6px;border-radius:2px;"></code></p>
                    
                    <form id="setupTotpForm">
                        <div class="form-group">
                            <label>Enter TOTP Code</label>
                            <input type="text" id="setupTotpCode" pattern="\\d{6}" maxlength="6" placeholder="000000" required autofocus style="width:100%;padding:10px;text-align:center;letter-spacing:6px;font-size:1.2rem;border:2px solid var(--border-light);border-radius:4px;">
                        </div>
                        <button type="submit" class="btn btn-primary btn-full mt-20" style="background:#000;border-color:#000;">Verify & Enable</button>
                    </form>
                </div>
            </div>

            <!-- Step 3: Verify TOTP -->
            <div id="step-totp" class="step-container">
                <form id="verifyTotpForm">
                    <p style="text-align:center;margin-bottom:16px;font-weight:600;">Enter TOTP Code</p>
                    <p style="text-align:center;font-size:0.85rem;color:var(--gray-mid);margin-bottom:16px;">Enter the 6-digit code from your authenticator app</p>
                    <div class="form-group">
                        <input type="text" id="verifyTotpCode" pattern="\\d{6}" maxlength="6" placeholder="000000" required autofocus style="width:100%;padding:10px;text-align:center;letter-spacing:6px;font-size:1.2rem;border:2px solid var(--border-light);border-radius:4px;">
                    </div>
                    <button type="submit" class="btn btn-primary btn-full mt-20" style="background:#000;border-color:#000;">Verify</button>
                </form>
            </div>

        </div>
    </div>

    <script src="/js/admin/login.js"></script>
</body>
</html>
