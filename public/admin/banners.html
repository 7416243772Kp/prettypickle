<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Banners | Admin — Pretty Pickles</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="admin-layout">
        <div id="admin-sidebar-container"></div>

        <div class="admin-content">
            <div class="admin-page">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                    <h1>Manage Banners</h1>
                    <button class="btn btn-primary" onclick="openBannerModal()">+ Add Banner / Marquee</button>
                </div>
                
                <div id="loadingIndicator" style="text-align:center;padding:40px;">
                    Loading banners...
                </div>

                <div id="bannersContainer" style="display:none;grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));gap:20px;"></div>
            </div>
        </div>
    </div>

    <!-- Banner Form Modal -->
    <div id="bannerModal" class="modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center;">
        <div class="modal-content" style="background:#fff;padding:24px;border-radius:8px;width:100%;max-width:500px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                <h2 id="modalTitle">Add Banner</h2>
                <button class="btn btn-small" onclick="closeBannerModal()" style="background:transparent;color:#000;font-size:1.5rem;border:none;">&times;</button>
            </div>
            
            <form id="bannerForm">
                <input type="hidden" id="bannerId" name="id">

                <div class="form-group">
                    <label>Position *</label>
                    <select name="position" id="position" required style="width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;">
                        <option value="hero">Hero Carousel (Top)</option>
                        <option value="middle">Middle Promo Banner</option>
                        <option value="footer">Footer Banner</option>
                        <option value="marquee">Scrolling Marquee Text</option>
                    </select>
                </div>

                <div id="imageGroup" class="form-group">
                    <label>Banner Image (Desktop/Mobile responsive recommended)</label>
                    <input type="file" name="image" id="bannerImage" accept="image/*" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;">
                    <img id="currentImagePreview" style="max-height:100px;margin-top:10px;display:none;border-radius:4px;">
                </div>

                <div id="textGroup" class="form-group" style="display:none;">
                    <label>Scroll Text (For Marquee)</label>
                    <input type="text" name="scrollText" id="scrollText" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;">
                    <input type="hidden" name="isScrolling" id="isScrolling" value="false">
                </div>

                <div class="form-group">
                    <label>Link (URL path to redirect on click)</label>
                    <input type="text" name="link" id="bannerLink" placeholder="e.g. /category/pickles" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;">
                </div>

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
                    <div class="form-group">
                        <label>Display Order</label>
                        <input type="number" name="displayOrder" id="displayOrder" value="0" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;">
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select name="isActive" id="isActive" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;">
                            <option value="true">Active</option>
                            <option value="false">Inactive</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-full" id="submitBtn">Save Banner</button>
            </form>
        </div>
    </div>

    <script src="/js/admin/components.js"></script>
    <script src="/js/admin/banners.js"></script>
</body>
</html>
