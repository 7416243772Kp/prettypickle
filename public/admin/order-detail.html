<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Order Detail | Admin — Pretty Pickles</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="admin-layout">
        <div id="admin-sidebar-container"></div>

        <div class="admin-content">
            <div class="admin-page">
                
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                    <h1 id="pageTitle">Order Details</h1>
                    <a href="/admin/orders" class="btn btn-small" style="background:#f5f5f5;color:#000;">← Back to Orders</a>
                </div>

                <div id="loadingIndicator" style="text-align:center;padding:40px;">
                    Loading order...
                </div>

                <div id="orderContainer" style="display:none;">
                    <div style="display:flex;justify-content:space-between;align-items:center;background:#f9f9f9;padding:16px;border-radius:8px;border:1px solid #eee;margin-bottom:24px;">
                        <div>
                            <strong style="font-size:1.2rem;" id="orderIdText">---</strong><br>
                            <span style="font-size:0.9rem;color:var(--gray-mid);" id="orderDateText">---</span>
                        </div>
                        <div style="text-align:right;">
                            <span id="orderStatusBadge" class="order-status pending" style="font-size:1rem;padding:6px 12px;margin-bottom:8px;display:inline-block;">Pending</span>
                            
                            <div style="margin-top:12px;">
                                <label style="font-size:0.8rem;margin-right:8px;">Update Status:</label>
                                <select id="updateStatusSelect" style="padding:6px;border:1px solid #ccc;border-radius:4px;">
                                    <option value="pending">Pending</option>
                                    <option value="paid">Paid</option>
                                    <option value="packed">Packed</option>
                                    <option value="shipped">Shipped</option>
                                    <option value="delivered">Delivered</option>
                                    <option value="cancelled">Cancelled</option>
                                </select>
                                <button class="btn btn-small btn-primary" onclick="updateOrderStatus()">Update</button>
                            </div>
                        </div>
                    </div>

                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px;">
                        <div style="border:1px solid #eee;border-radius:8px;padding:20px;">
                            <h3 style="margin-bottom:16px;border-bottom:1px solid #eee;padding-bottom:8px;">Customer Details</h3>
                            <p style="margin-bottom:8px;"><strong>Name:</strong> <span id="cName"></span></p>
                            <p style="margin-bottom:8px;"><strong>Email:</strong> <span id="cEmail"></span></p>
                            <p style="margin-bottom:8px;"><strong>Phone:</strong> <span id="cPhone"></span></p>
                        </div>
                        <div style="border:1px solid #eee;border-radius:8px;padding:20px;">
                            <h3 style="margin-bottom:16px;border-bottom:1px solid #eee;padding-bottom:8px;">Shipping Address</h3>
                            <p style="margin-bottom:4px;" id="sFullName"></p>
                            <p style="margin-bottom:4px;" id="sLine1"></p>
                            <p style="margin-bottom:4px;" id="sLine2"></p>
                            <p style="margin-bottom:4px;" id="sCityStateZip"></p>
                        </div>
                    </div>

                    <h3 style="margin-bottom:16px;">Items</h3>
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th>Variant</th>
                                <th>Price</th>
                                <th>Qty</th>
                                <th>Total</th>
                            </tr>
                        </thead>
                        <tbody id="orderItemsBody"></tbody>
                    </table>

                    <div style="display:flex;justify-content:flex-end;margin-top:24px;">
                        <div style="width:300px;background:#f9f9f9;padding:20px;border-radius:8px;border:1px solid #eee;">
                            <div style="display:flex;justify-content:space-between;margin-bottom:12px;">
                                <span>Subtotal</span>
                                <strong id="subtotalCost">₹0</strong>
                            </div>
                            <div style="display:flex;justify-content:space-between;margin-bottom:12px;">
                                <span>Delivery</span>
                                <strong id="deliveryCost">₹0</strong>
                            </div>
                            <div style="display:flex;justify-content:space-between;margin-bottom:12px;color:red;display:none;" id="discountRow">
                                <span>Discount</span>
                                <strong id="discountCost">-₹0</strong>
                            </div>
                            <div style="display:flex;justify-content:space-between;border-top:1px solid #ddd;padding-top:12px;margin-top:12px;font-size:1.2rem;">
                                <strong>Total</strong>
                                <strong id="totalCost">₹0</strong>
                            </div>
                            <div style="margin-top:12px;font-size:0.9rem;text-align:right;">
                                Payment Method: <strong style="text-transform:uppercase;" id="payMethod">---</strong>
                            </div>
                            <div style="margin-top:8px;font-size:0.9rem;text-align:right;" id="payStatusDiv">
                                Payment Status: <strong id="payStatus">---</strong>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="/js/admin/components.js"></script>
    <script src="/js/admin/order-detail.js"></script>
</body>
</html>
