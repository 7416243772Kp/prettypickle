<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Products | Admin — Pretty Pickles</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="admin-layout">
        
        <div id="admin-sidebar-container"></div>

        <div class="admin-content">
            <div class="admin-page">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                    <h1>Products</h1>
                    <a href="/admin/products/new" class="btn btn-primary">+ Add Product</a>
                </div>
                
                <div id="loadingIndicator" style="text-align:center;padding:40px;">
                    Loading products...
                </div>

                <table class="admin-table" id="productsTableContainer" style="display:none;">
                    <thead>
                        <tr>
                            <th>Image</th>
                            <th>Title</th>
                            <th>Category</th>
                            <th>Type</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="productsTableBody">
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="/js/admin/components.js"></script>
    <script src="/js/admin/products.js"></script>
</body>
</html>
