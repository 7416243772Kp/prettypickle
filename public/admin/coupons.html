<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Coupons | Admin — Pretty Pickles</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="admin-layout">
        <div id="admin-sidebar-container"></div>

        <div class="admin-content">
            <div class="admin-page">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                    <h1>Manage Coupons</h1>
                    <a href="/admin/coupons/new" class="btn btn-primary">+ Create Coupon</a>
                </div>
                
                <div id="loadingIndicator" style="text-align:center;padding:40px;">
                    Loading coupons...
                </div>

                <table class="admin-table" id="couponsTableContainer" style="display:none;">
                    <thead>
                        <tr>
                            <th>Code</th>
                            <th>Discount</th>
                            <th>Usage Type</th>
                            <th>Scope</th>
                            <th>Expiry</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="couponsTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/js/admin/components.js"></script>
    <script src="/js/admin/coupons.js"></script>
</body>
</html>
