<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Categories | Admin — Pretty Pickles</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
    <style>
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal { background: #fff; padding: 24px; border-radius: 8px; width: 90%; max-width: 500px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="admin-layout">
        <div id="admin-sidebar-container"></div>

        <div class="admin-content">
            <div class="admin-page">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                    <h1>Categories</h1>
                    <button class="btn btn-primary" onclick="openCategoryModal()">+ Add Category</button>
                </div>
                
                <div id="loadingIndicator" style="text-align:center;padding:40px;">
                    Loading categories...
                </div>

                <table class="admin-table" id="categoriesTableContainer" style="display:none;">
                    <thead>
                        <tr>
                            <th>Order</th>
                            <th>Name</th>
                            <th>Description</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="categoriesTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="categoryModal">
        <div class="modal">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                <h3 id="modalTitle">Add Category</h3>
                <span style="font-size:1.5rem;cursor:pointer;" onclick="closeCategoryModal()">×</span>
            </div>
            <form id="categoryForm">
                <input type="hidden" name="id" id="categoryId">
                <div class="form-group">
                    <label>Category Name *</label>
                    <input type="text" name="name" id="categoryName" required style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:4px;">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea name="description" id="categoryDesc" rows="3" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:4px;"></textarea>
                </div>
                <div class="form-group">
                    <label>Display Order (Lower comes first)</label>
                    <input type="number" name="displayOrder" id="categoryOrder" value="0" style="width:100%;padding:10px;border:1px solid var(--border-light);border-radius:4px;">
                </div>
                <button type="submit" class="btn btn-primary btn-full mt-20" id="submitBtn">Save Category</button>
            </form>
        </div>
    </div>

    <script src="/js/admin/components.js"></script>
    <script src="/js/admin/categories.js"></script>
</body>
</html>
