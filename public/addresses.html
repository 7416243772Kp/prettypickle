<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="My Addresses | Pretty Pickles">
    <title>My Addresses | Pretty Pickles</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
    <style>
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-close {
            font-size: 1.5rem;
            cursor: pointer;
        }
        .address-card {
            border: 1px solid var(--border-light);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 12px;
            position: relative;
        }
        .address-card-label {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--primary);
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <div id="header-container"></div>

    <main>
        <div class="container addresses-page">
            <h1 class="page-title">My Addresses</h1>
            
            <button class="btn btn-primary mb-20" onclick="document.getElementById('addressModal').classList.add('active')">+ Add Address</button>
            
            <div id="addressesContainer">
                <p style="text-align:center; padding: 40px;">Loading addresses...</p>
            </div>
            
            <div class="modal-overlay" id="addressModal">
                <div class="modal">
                    <div class="modal-header">
                        <h3>Add Address</h3>
                        <span class="modal-close" onclick="document.getElementById('addressModal').classList.remove('active')">×</span>
                    </div>
                    <form id="addressForm">
                        <div class="form-group">
                            <label>Label</label>
                            <select name="label" style="width:100%;padding:10px;border:2px solid var(--border-light);border-radius:4px;">
                                <option>Home</option>
                                <option>Office</option>
                                <option>Other</option>
                            </select>
                        </div>
                        <div class="form-group"><label>Full Name</label><input type="text" name="fullName" style="width:100%;padding:10px;border:2px solid var(--border-light);border-radius:4px;" required></div>
                        <div class="form-group"><label>Phone</label><input type="text" name="phone" pattern="[6-9]\d{9}" required placeholder="10-digit mobile" style="width:100%;padding:10px;border:2px solid var(--border-light);border-radius:4px;"></div>
                        <div class="form-group"><label>Address Line 1</label><input type="text" name="line1" style="width:100%;padding:10px;border:2px solid var(--border-light);border-radius:4px;" required></div>
                        <div class="form-group"><label>Address Line 2</label><input type="text" name="line2" style="width:100%;padding:10px;border:2px solid var(--border-light);border-radius:4px;"></div>
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                            <div class="form-group"><label>City</label><input type="text" name="city" style="width:100%;padding:10px;border:2px solid var(--border-light);border-radius:4px;" required></div>
                            <div class="form-group"><label>State</label><input type="text" name="state" style="width:100%;padding:10px;border:2px solid var(--border-light);border-radius:4px;" required></div>
                        </div>
                        <div class="form-group"><label>Pincode</label><input type="text" name="pincode" pattern="\d{6}" style="width:100%;padding:10px;border:2px solid var(--border-light);border-radius:4px;" required></div>
                        <div class="form-group" style="display:flex;align-items:center;gap:8px;">
                            <input type="checkbox" name="isDefault" id="isDefault"> 
                            <label for="isDefault" style="margin:0;">Set as default</label>
                        </div>
                        <button type="submit" class="btn btn-primary btn-full mt-20">Save Address</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="/js/components.js"></script>
    <script src="/js/addresses.js"></script>
</body>
</html>
